schema_version: 1

context:
  name: swmmtoolbox
  version: "4.1.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 776ee1a21ea55f153372b2425b9cd253869c13c4377d3dea45b0fb31f6f2e655

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps
  python:
    entry_points:
      - swmmtoolbox = swmmtoolbox.swmmtoolbox:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=45
    - setuptools-scm >=6.2
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - cltoolbox >=1.0.0
    - dateparser
    - tabulate
    - numpy
    - scipy
    - pandas
    - pint-pandas
    - pint !=0.21
    - pydantic
    - typing-extensions
    - odfpy >=1.4.1
    - xlrd >=2.0.1
    - openpyxl >=3.0.7
    - pyxlsb >=1.0.8
    - pytables >=3.6.1
    - matplotlib-base >=3.3.2
    - xlsxwriter

tests:
  - python:
      imports:
        - swmmtoolbox
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - swmmtoolbox --help

about:
  summary: Command line script and Python library to read Storm Water Management Model binary output.
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/swmmtoolbox/

extra:
  recipe-maintainers:
    - timcera
